[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-ci"
version = "0.0.1"
description = "Test the code examples in your documentation — automatically, in CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Sanjay C." },
]
keywords = ["documentation", "ci", "testing", "markdown", "examples"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/machine-operable/doc-ci"
Issues = "https://github.com/machine-operable/doc-ci/issues"

[project.scripts]
doc-ci = "doc_ci.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
